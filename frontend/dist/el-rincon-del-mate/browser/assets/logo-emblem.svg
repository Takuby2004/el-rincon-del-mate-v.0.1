<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gold ring gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c984" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9a7732" />
    </linearGradient>

    <!-- Arc path for EL RINCÓN DEL text -->
    <path id="topTextArc" d="M 95 160 A 130 130 0 0 1 305 160" fill="none" />
    <!-- Arc path for MATE text -->
    <path id="bottomTextArc" d="M 80 250 A 135 135 0 0 0 320 250" fill="none" />
  </defs>

  <!-- Outer Black Circle Base -->
  <circle cx="200" cy="200" r="195" fill="#141414" stroke="#0a0a0a" stroke-width="4" />

  <!-- Double Gold Concentric Border Rings -->
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#goldRing)" stroke-width="2.5" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#goldRing)" stroke-width="1.5" />
  <circle cx="200" cy="200" r="169" fill="none" stroke="url(#goldRing)" stroke-width="2.5" />

  <!-- Upper Cream Banner Wave Shape -->
  <path d="M 40 185 C 40 185, 110 65, 200 65 C 290 65, 360 185, 360 185 C 320 215, 275 220, 200 220 C 125 220, 80 215, 40 185 Z" fill="#eee5d3" />

  <!-- Curved Text: EL RINCÓN DEL -->
  <text font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-size="21" font-weight="900" fill="#141414" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      — EL RINCÓN DEL —
    </textPath>
  </text>

  <!-- Inner Central Black Circle -->
  <circle cx="200" cy="190" r="72" fill="#141414" stroke="url(#goldRing)" stroke-width="3" />
  <circle cx="200" cy="190" r="65" fill="none" stroke="url(#goldRing)" stroke-width="1.5" />

  <!-- Mate & Bombilla Icon in Center (White Line Art) -->
  <g id="centerMateIcon" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bombilla (Bent Straw) -->
    <path d="M 170 142 L 192 165 L 192 180" stroke-width="4.5" />
    <path d="M 166 138 L 174 146" stroke-width="3" />

    <!-- Mate Gourd Body -->
    <path d="M 175 178 C 170 185, 170 205, 180 218 C 190 226, 210 226, 220 218 C 230 205, 230 185, 225 178 Z" stroke-width="4.5" fill="#141414" />
    
    <!-- Mate Opening Rim / Virola Line -->
    <ellipse cx="200" cy="178" rx="25" ry="5" stroke-width="4" />
  </g>

  <!-- Bottom Text: MATE (Bold White Arc) -->
  <text font-family="'Outfit', 'Montserrat', 'Impact', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="10">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      MATE
    </textPath>
  </text>
</svg>
