<aside
  class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 w-full max-w-sm pointer-events-none px-4 sm:px-0"
  role="status"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto relative overflow-hidden rounded-2xl border p-4 shadow-2xl backdrop-blur-md transition-all duration-300 animate-slide-in group"
      [ngClass]="getBorderClass(toast.type)"
    >
      <div class="flex items-start gap-3.5">
        <!-- Icono con halo suave -->
        <div class="flex-shrink-0 mt-0.5 text-xl">
          <i [class]="getIconClass(toast.type)"></i>
        </div>

        <!-- Contenido textual -->
        <div class="flex-1 min-w-0 pr-2">
          @if (toast.title) {
            <h4 class="text-sm font-semibold tracking-wide text-white mb-0.5">
              {{ toast.title }}
            </h4>
          }
          <p class="text-xs text-slate-300 leading-relaxed break-words">
            {{ toast.message }}
          </p>
        </div>

        <!-- Botón para cerrar -->
        <button
          type="button"
          (click)="dismiss(toast.id)"
          class="flex-shrink-0 text-slate-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/10"
          aria-label="Cerrar notificación"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Barra de progreso con cuenta regresiva -->
      @if (toast.duration > 0) {
        <div
          class="absolute bottom-0 left-0 h-1 w-full rounded-full overflow-hidden bg-white/10"
        >
          <div
            class="h-full toast-progress"
            [ngClass]="getProgressBarClass(toast.type)"
            [style.animationDuration]="toast.duration + 'ms'"
          ></div>
        </div>
      }
    </div>
  }
</aside>
